[uwsgi]
#socket=/usr/src/app/escriptorium/app.sock
#chmod-socket=664
http=0.0.0.0:8899
#chdir=%dapp/
chdir=/usr/src/app/
module=escriptorium.wsgi:application
processes = 4
#threads = 2
#stats = 127.0.0.1:9191
vacuum=True
master = true
respawn-on-exit = true
reload-on-rss = 512  # Restart worker at 1GB instead of waiting for OOM
max-requests = 1000   # Restart worker after N requests to prevent leaks
buffer-size=32768
