[uwsgi]
#socket=/usr/src/app/escriptorium/app.sock
#chmod-socket=664
http=0.0.0.0:8899
#chdir=%dapp/
chdir=/usr/src/app/
module=escriptorium.wsgi:application
#processes = 4
#threads = 2
#stats = 127.0.0.1:9191
vacuum=True
# Automatically respawn dead workers
respawn-on-exit = true
# Or use master process to manage workers better
# master = true